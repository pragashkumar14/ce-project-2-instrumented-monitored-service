<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg">
<rect width="680" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<g>
<rect x="250" y="30" width="180" height="56" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="50" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#26215C">Customer</text>
<text x="340" y="68" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#3C3489">Places an order</text>
</g>

<line x1="340" y1="86" x2="340" y2="120" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="250" y="120" width="180" height="56" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<text x="340" y="140" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#042C53">Order system</text>
<text x="340" y="158" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0C447C">Checks the details</text>
</g>

<path d="M340 176 L340 200 L110 200 L110 230" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 176 L340 210 L340 230" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 176 L340 200 L570 200 L570 230" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="20" y="230" width="180" height="56" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="110" y="250" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#412402">Details missing</text>
<text x="110" y="268" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#854F0B">Please fill this in</text>
</g>

<g>
<rect x="250" y="230" width="180" height="56" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
<text x="340" y="250" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#04342C">Order confirmed</text>
<text x="340" y="268" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#0F6E56">Customer gets a receipt</text>
</g>

<g>
<rect x="480" y="230" width="180" height="56" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
<text x="570" y="250" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#4A1B0C">System error</text>
<text x="570" y="268" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#993C1D">Please try again</text>
</g>

<line x1="570" y1="286" x2="570" y2="320" fill="none" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="480" y="320" width="180" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="570" y="340" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A">Recorded, not shown</text>
<text x="570" y="358" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="12" fill="#5F5E5A">A private tracking number</text>
</g>

<text x="340" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5F5E5A">The customer never sees this tracking number — but it lets the team find</text>
<text x="340" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#5F5E5A">exactly what happened to any single order, even hours or days later.</text>
</svg>
